<!DOCTYPE html>
<html>
<head>
    <title>User</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>

    <div>
        <h2>User</h2>

        <div id="locationPanel">

            <h3>Location Verification</h3>

            <span id="locationStatus">
                Waiting...
            </span>

            <br /><br />

            <button id="retryLocationBtn"
                    onclick="captureLocation()"
                    style="display:none;">
                Retry Location
            </button>

        </div>
        <video id="localVideo" autoplay muted playsinline style="width:200px;"></video>
        <video id="remoteVideo" autoplay playsinline style="width:400px;"></video>

        <br />

        <button onclick="toggleMic()">Mute/Unmute</button>
        <button onclick="toggleCamera()">Camera On/Off</button>
        <button onclick="flipCamera()">Flip Camera </button>
        <button onclick="endCall()">End Call</button>

        <p id="status">Waiting...</p>
    </div>

    <hr />

    <h3>Chat</h3>

    <div id="chatBox"
         style="height:200px;
            overflow:auto;
            border:1px solid gray;">
    </div>

    <input type="text" id="chatInput" />

    <button onclick="sendChat()">
        Send
    </button>


    <script>

        let connection;
        let peerConnection;
        let localStream;
        let isInCall = false;
        let currentUserConnectionId = null;
        let currentSessionId = null;
        let currentFacingMode = "user";
        let locationVerified = false;
        let cameras = [];

        let currentCameraIndex = 0;

        async function startApp() {
            debugger;
            connection = new signalR.HubConnectionBuilder().withUrl("/callHub").build();

            await connection.start();
            const userId = "TEST_USER";
            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            await loadCameras();

            document.getElementById("localVideo").srcObject = localStream;

            currentSessionId = await connection.invoke("JoinQueue", userId);
            await sendDeviceInfo();

            await captureLocation();

            console.log("Customer Verification Ready");

            console.log("Session ID:", currentSessionId);
            let turnConfig;

            try {

                const response = await fetch("/api/turn");

                turnConfig = await response.json();

                console.log("TURN Config Loaded");

            }
            catch (err) {

                console.error("TURN API failed", err);

                return;
            }

            connection.on("CallStarted", async (adminConnectionId) => {
                currentUserConnectionId = adminConnectionId;
                if (isInCall) return; 
                isInCall = true;

                document.getElementById("status").innerText = "Connecting...";

                //peerConnection = new RTCPeerConnection({
                //    iceServers: [
                //        {
                //            urls: "stun:stun.relay.metered.ca:80",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:80",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:80?transport=tcp",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:443",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turns:global.relay.metered.ca:443?transport=tcp",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //    ]
                //});


                peerConnection = new RTCPeerConnection({
                    iceServers: turnConfig.iceServers
                });

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        connection.invoke("SendIceCandidate", adminConnectionId, JSON.stringify(event.candidate));
                    }
                };

                peerConnection.ontrack = event => {
                    document.getElementById("remoteVideo").srcObject = event.streams[0];
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log("User connection:", peerConnection.connectionState);
                };
                peerConnection.oniceconnectionstatechange = () => {
                    console.log("ICE State:", peerConnection.iceConnectionState);
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log("Connection State:", peerConnection.connectionState);
                };
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                await connection.invoke("SendOffer", adminConnectionId, JSON.stringify(offer));
            });

            connection.on("ReceiveAnswer", async (answer) => {
                await peerConnection.setRemoteDescription(JSON.parse(answer));
                document.getElementById("status").innerText = "Live";
            });

            connection.on("ReceiveIceCandidate", async (candidate) => {
                if (!peerConnection) return;
                await peerConnection.addIceCandidate(JSON.parse(candidate));
            });

            connection.on("CallEnded", () => {
                cleanupCall();
            });
        }

        startApp();

        async function sendChat() {

            const message = document.getElementById("chatInput").value;

            if (!message) return;

            await connection.invoke("SendChatMessage",currentSessionId,currentUserConnectionId,"User",message);

            document.getElementById("chatInput").value = "";
        }

        function cleanupCall() {
            debugger;
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            document.getElementById("remoteVideo").srcObject = null;
            document.getElementById("status").innerText = "Call Ended";

            isInCall = false;
        }

        function toggleMic() {
            if (!localStream) return;
            localStream.getAudioTracks().forEach(track => {
                track.enabled = !track.enabled;
            });
        }

        function toggleCamera() {
            if (!localStream) return;
            localStream.getVideoTracks().forEach(track => {
                track.enabled = !track.enabled;
            });
        }

        async function endCall() {
            cleanupCall();
            await connection.invoke("EndCall");
        }

        connection.on("ReceiveChatMessage",
            (sender, message) => {

                addChatMessage(sender, message);
            });

        function addChatMessage(sender, message) {

            const div = document.createElement("div");

            div.innerHTML =`<b>${sender}:</b> ${message}`;

            document.getElementById("chatBox").appendChild(div);
        }

        async function captureLocation() {

            if (!navigator.geolocation) {

                alert("Geolocation not supported");
                return;
            }

            navigator.geolocation.getCurrentPosition(

                async (position) => {

                    locationVerified = true;

                    document.getElementById("locationStatus").innerHTML = "✅ Location Captured";

                    document.getElementById("retryLocationBtn").style.display = "none";

                    const payload = {

                        sessionId: currentSessionId,

                        latitude: position.coords.latitude,

                        longitude: position.coords.longitude,

                        accuracy: position.coords.accuracy
                    };

                    const response =
                        await fetch("/api/location/save", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify(payload)
                        });

                    if (!response.ok) {

                        alert("Location save failed");
                    }
                },

                (error) => {

                    locationVerified = false;

                    document.getElementById("locationStatus").innerHTML = "❌ Location Required";

                    document.getElementById("retryLocationBtn").style.display = "block";

                    console.error(error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 20000,
                    maximumAge: 60000
                }
            );
        }

        async function flipCamera() {

            if (cameras.length < 2) {
                alert("Only one camera found");
                return;
            }
            currentCameraIndex++;

            if (currentCameraIndex >= cameras.length)
            {
                currentCameraIndex = 0;
            }

            const newStream = await navigator.mediaDevices
                    .getUserMedia({

                        video: {

                            deviceId: {

                                exact:
                                    cameras[
                                        currentCameraIndex
                                    ].deviceId
                            }
                        },

                        audio: true
                    });

            const newVideoTrack = newStream.getVideoTracks()[0];

            const sender = peerConnection
                    ?.getSenders()
                    .find(s =>
                        s.track?.kind ===
                        "video"
                    );

            if (sender) {

                await sender.replaceTrack(newVideoTrack);
            }

            localStream.getVideoTracks().forEach(t => t.stop());

            document.getElementById("localVideo").srcObject = newStream;

            localStream = newStream;
        }
        async function loadCameras() {

            const devices = await navigator.mediaDevices.enumerateDevices();

            cameras = devices.filter(d => d.kind === "videoinput");

            console.log("Cameras",cameras);
        }
        async function sendDeviceInfo() {

            const devices = await navigator.mediaDevices.enumerateDevices();

            const payload = {

                sessionId: currentSessionId,

                userAgent: navigator.userAgent,

                platform: navigator.platform,

                screenWidth: screen.width,

                screenHeight: screen.height,

                language: navigator.language,

                cameraAvailable:
                    devices.some(
                        d => d.kind === "videoinput"
                    ),

                microphoneAvailable:
                    devices.some(
                        d => d.kind === "audioinput"
                    ),

                gpsAvailable:
                    !!navigator.geolocation,

                browser: getBrowser(),
                networkType:
                    navigator.connection
                        ?.effectiveType || "Unknown",

                downlink:
                    navigator.connection
                        ?.downlink || 0
            };

            console.log(payload);

            await fetch("/api/device/save",
                {
                    method: "POST",

                    headers:
                    {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(payload)
                });
        }

        function getBrowser() {

            const ua =
                navigator.userAgent;

            if (ua.includes("Chrome"))
                return "Chrome";

            if (ua.includes("Safari"))
                return "Safari";

            if (ua.includes("Firefox"))
                return "Firefox";

            return "Unknown";
        }
    </script>

</body>
</html>
