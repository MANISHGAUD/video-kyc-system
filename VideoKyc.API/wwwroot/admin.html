<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
</head>
<body>

    <h2>Admin Dashboard</h2>

    <p id="status">Waiting...</p>
    <h3 id="callTimer">00:00:00</h3>
    <ul id="users"></ul>

    <h2 id="recordingIndicator" style="display:none; color:red;">
        🔴 RECORDING
    </h2>

    <div style=" position:relative;width:900px;">

        <video id="remoteVideo" autoplay playsinline style="width:900px;border:1px solid gray;"></video>

        <video id="localVideo" autoplay muted playsinline style="position:absolute;bottom:20px;right:20px;width:220px;border:2px solid white;"></video>

    </div>
    <div id="customerPanel">

        <h3>Customer Details</h3>

        <div id="customerInfo">

        </div>

    </div>
    <br />
    <hr />

    <h3>Network Health</h3>

    <p>
        Customer:
        <span id="customerNetwork">
            Waiting...
        </span>
    </p>

    <p>
        Agent:
        <span id="agentNetwork">
            Waiting...
        </span>
    </p>
    <button onclick="endCall()">End Call</button>

    <hr />

    <h3>Chat</h3>

    <div id="chatBox"
         style="height:200px;
            overflow:auto;
            border:1px solid gray;">
    </div>

    <input type="text" id="chatInput" />

    <button onclick="sendChat()">
        Send
    </button>

    <hr />

    <h3>KYC Details</h3>

    <input type="text"
           id="panNumber"
           placeholder="PAN Number" />

    <br /><br />

    <input type="text"
           id="fullName"
           placeholder="Full Name" />

    <br /><br />

    <input type="text"
           id="dob"
           placeholder="DOB" />

    <br /><br />

<textarea id="address"
          placeholder="Address"></textarea>

    <br /><br />

    <input type="text"
           id="occupation"
           placeholder="Occupation" />

    <br /><br />

    <label>
        <input type="checkbox"
               id="consentGiven" />
        Consent Given
    </label>

    <br /><br />

<textarea id="remarks"
          placeholder="Remarks"></textarea>

    <br /><br />

    <button onclick="saveKycDetails()">
        Save KYC
    </button>

    <hr />

    <h3>Captures</h3>

    <button onclick="captureImage('Face')">
        Capture Face
    </button>

    <button onclick="captureImage('Document')">
        Capture Document
    </button>

    <hr />

    <h3>Recording</h3>

    <button onclick="startRecording()">
        Start Recording
    </button>

    <button onclick="stopRecording()">
        Stop Recording
    </button>

    <script>

        let connection;
        let peerConnection;
        let localStream;
        let isInCall = false;
        let currentUserConnectionId = null;
        let currentSessionId = null;

        let mediaRecorder;

        let recordedChunks = [];

        let isRecording = false;
        let callStartTime;
        let timerInterval;
        let networkMonitorInterval;

        async function joinUser(connectionId, sessionId, btn) {

            currentUserConnectionId = connectionId;

            currentSessionId = sessionId;

            if (isInCall) return;

            btn.disabled = true;

            document.getElementById("status").innerText = "Connecting...";

            await loadCustomerDetails(sessionId);

            await connection.invoke("StartCall", connectionId);
        }

        async function sendChat() {

            const message = document.getElementById("chatInput").value;

            if (!message) return;

            await connection.invoke("SendChatMessage", currentSessionId, currentUserConnectionId, "Admin", message);

            document.getElementById("chatInput").value = "";
        }

        function addChatMessage(sender, message) {

            const div = document.createElement("div");

            div.innerHTML = `<b>${sender}:</b> ${message}`;

            document.getElementById("chatBox").appendChild(div);
        }

        async function endCall() {
            cleanupCall();
            await connection.invoke("EndCall");
        }

        async function startApp() {
            debugger;
            connection = new signalR.HubConnectionBuilder().withUrl("/callHub", {
                accessTokenFactory: () =>
                    localStorage.getItem("token")
            }).build();

            //connection.on("UpdateQueue", (users) => {

            //    const ul = document.getElementById("users");
            //    ul.innerHTML = "";

            //    users.forEach(session => {const li = document.createElement("li");

            //        li.innerHTML = `${session.userId}

            //        <button onclick="joinUser('${session.userConnectionId}','${session.id}',this)">Join</button>`;
            //        ul.appendChild(li);
            //    });
            //});

            connection.on("UpdateQueue", (users) => {

                const ul = document.getElementById("users");

                ul.innerHTML = "";

                users.forEach(session => {

                    const gpsStatus =
                        session.location
                            ? "🟢"
                            : "🔴";

                    const deviceStatus =
                        session.deviceInfo
                            ? "🟢"
                            : "🔴";

                    const li =
                        document.createElement("li");

                    li.innerHTML = `

            Customer:
            ${session.userId}

            <br>

            GPS:
            ${gpsStatus}

            <br>

            Device:
            ${deviceStatus}

            <br><br>

            <button onclick="
                joinUser(
                    '${session.userConnectionId}',
                    '${session.id}',
                    this
                )">

                Join

            </button>

            <hr/>
        `;

                    ul.appendChild(li);
                });
            });

            await connection.start();
            await connection.invoke("JoinAdmin");

            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });

            document.getElementById("localVideo").srcObject = localStream;

            connection.on("UserAlreadyTaken", () => {
                alert("User already taken");
            });


            let turnConfig;

            try {

                const response = await fetch("/api/turn");

                turnConfig = await response.json();

                console.log("TURN Config Loaded");

            }
            catch (err) {

                console.error("TURN API failed", err);

                return;
            }


            connection.on("ReceiveOffer", async (offer, userConnectionId) => {

                if (isInCall) return;
                isInCall = true;
                document.getElementById("status").innerText = "Live";

                networkMonitorInterval = setInterval(monitorNetwork, 5000);

                startCallTimer();
                //peerConnection = new RTCPeerConnection({
                //    iceServers: [
                //        {
                //            urls: "stun:stun.relay.metered.ca:80",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:80",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:80?transport=tcp",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turn:global.relay.metered.ca:443",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //        {
                //            urls: "turns:global.relay.metered.ca:443?transport=tcp",
                //            username: "ec89d1d30e157d8b291c172c",
                //            credential: "QEn/hIYXcJ5souCu",
                //        },
                //    ]
                //});


                peerConnection = new RTCPeerConnection({
                    iceServers: turnConfig.iceServers
                });


                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.onicecandidate = event => {
                    if (event.candidate) {
                        connection.invoke("SendIceCandidate", userConnectionId, JSON.stringify(event.candidate));
                    }
                };

                peerConnection.ontrack = event => {
                    document.getElementById("remoteVideo").srcObject = event.streams[0];
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log("Admin connection:", peerConnection.connectionState);
                };
                peerConnection.oniceconnectionstatechange = () => {
                    console.log("ICE State:", peerConnection.iceConnectionState);
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log("Connection State:", peerConnection.connectionState);
                };
                await peerConnection.setRemoteDescription(JSON.parse(offer));

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await connection.invoke("SendAnswer", userConnectionId, JSON.stringify(answer));

                document.getElementById("status").innerText = "Live";
            });

            connection.on("ReceiveIceCandidate", async (candidate) => {
                if (!peerConnection) return;
                await peerConnection.addIceCandidate(JSON.parse(candidate));
            });

            connection.on("CallEnded", () => {
                cleanupCall();
            });

            connection.on("ReceiveChatMessage", (sender, message) => { addChatMessage(sender, message); });
        }

        function cleanupCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            clearInterval(networkMonitorInterval);

            document.getElementById("callTimer").innerText = "00:00:00";

            document.getElementById("remoteVideo").srcObject = null;
            document.getElementById("status").innerText = "Call Ended";

            isInCall = false;
        }

        startApp();


        async function saveKycDetails() {

            const payload = {

                sessionId: currentSessionId,

                panNumber:
                    document.getElementById("panNumber").value,

                fullName:
                    document.getElementById("fullName").value,

                dob:
                    document.getElementById("dob").value,

                address:
                    document.getElementById("address").value,

                occupation:
                    document.getElementById("occupation").value,

                consentGiven:
                    document.getElementById("consentGiven").checked,

                remarks:
                    document.getElementById("remarks").value
            };

            const response = await fetch("/api/kyc/save",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

            if (response.ok) {

                alert("KYC Saved");
            }
        }

        async function captureImage(type) {

            const captureType = type;

            const video = document.getElementById("remoteVideo");

            const canvas = document.createElement("canvas");

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {

                const formData = new FormData();

                formData.append("file", blob, captureType + ".jpg");

                formData.append("sessionId", currentSessionId);

                formData.append("captureType", captureType);

                console.log("captureType:", captureType);

                const response = await fetch("/api/capture/upload",
                    {
                        method: "POST",
                        body: formData
                    });

                const result = await response.json();

                console.log("Capture saved:", result);

                if (response.ok) {
                    alert(captureType + " captured");
                }
                else {
                    console.error(result);
                    alert("Capture failed");
                }

            }, "image/jpeg");
        }

        async function startRecording() {

            if (isRecording) return;
            document.getElementById("recordingIndicator").style.display = "block";

            const remoteStream = document.getElementById("remoteVideo").srcObject;

            if (!remoteStream) {
                alert("Remote stream not ready");
                return;
            }
            const combinedStream =
                new MediaStream([
                    ...localStream.getTracks(),
                    ...remoteStream.getTracks()
                ]);

            mediaRecorder =
                new MediaRecorder(combinedStream, {
                    mimeType: "video/webm"
                });

            recordedChunks = [];

            mediaRecorder.ondataavailable = event => {

                if (event.data.size > 0) {

                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = uploadRecording;

            mediaRecorder.start(1000);

            isRecording = true;

            console.log("Recording started");
        }

        function stopRecording() {
            document.getElementById("recordingIndicator").style.display = "none";

            if (!mediaRecorder) return;

            mediaRecorder.stop();

            isRecording = false;

            console.log("Recording stopped");
        }
        async function uploadRecording() {

            const blob =
                new Blob(recordedChunks, {
                    type: "video/webm"
                });

            const formData = new FormData();

            formData.append("file", blob, "recording.webm");

            formData.append("sessionId", currentSessionId);

            const response = await fetch("/api/recording/upload",
                {
                    method: "POST",
                    body: formData
                });

            const result = await response.json();

            console.log("Recording uploaded:", result);

            alert("Recording uploaded");
        }

        function startCallTimer() {

            callStartTime = new Date();

            timerInterval = setInterval(() => {

                const diff =
                    Math.floor(
                        (new Date() - callStartTime) / 1000
                    );

                const hours = String(Math.floor(diff / 3600)).padStart(2, "0");

                const minutes = String(Math.floor((diff % 3600) / 60)).padStart(2, "0");

                const seconds = String(diff % 60).padStart(2, "0");

                document.getElementById("callTimer").innerText = `${hours}:${minutes}:${seconds}`;

            }, 1000);
        }
        async function monitorNetwork() {

            if (!peerConnection)
                return;

            const stats = await peerConnection.getStats();

            stats.forEach(report => {

                if (report.type === "candidate-pair") {

                    const rtt = report.currentRoundTripTime;

                    if (!rtt)
                        return;

                    const ms = Math.round(rtt * 1000);

                    let quality =  "🟢 Excellent";

                    if (ms > 200)
                        quality = "🟡 Moderate";

                    if (ms > 500)
                        quality = "🔴 Poor";

                    document.getElementById("customerNetwork").innerText = `${quality} (${ms} ms)`;

                    document.getElementById("agentNetwork").innerText = `${quality} (${ms} ms)`;
                }
            });
        }

        async function loadCustomerDetails(sessionId) {

            const response =
                await fetch(
                    `/api/session/details/${sessionId}`
                );

            const data =  await response.json();

            let html = "";

            if (data.deviceInfo) {

                html += `
            <h4>Device</h4>

            Platform:
            ${data.deviceInfo.platform}
            <br>

            Screen:
            ${data.deviceInfo.screenWidth}
            x
            ${data.deviceInfo.screenHeight}

            <br>

            Language:
            ${data.deviceInfo.language}

            <br>

            Camera:
            ${data.deviceInfo.cameraAvailable ? "Yes" : "No"}

            <br>

            Mic:
            ${data.deviceInfo.microphoneAvailable ? "Yes" : "No"}

            <br>

            GPS:
            ${data.deviceInfo.gpsAvailable ? "Yes" : "No"}

            <hr>
        `;
            }

            if (data.location) {

                html += `
            <h4>Location</h4>

            Latitude:
            ${data.location.latitude}

            <br>

            Longitude:
            ${data.location.longitude}

            <br>

            Accuracy:
            ${data.location.accuracy}

            <br>

            <a target="_blank"
               href="https://maps.google.com/?q=
               ${data.location.latitude},
               ${data.location.longitude}">
               View Map
            </a>
        `;
            }

            document.getElementById(
                "customerInfo"
            ).innerHTML = html;
        }
    </script>

</body>
</html>
